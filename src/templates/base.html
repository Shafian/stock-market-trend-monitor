<!DOCTYPE html>
<html>
<head>
    <title>Stock Market Trend Monitor</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
        }

        .navbar {
            background-color: #1f2937;
            padding: 15px 30px;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            margin-right: 20px;
            font-weight: bold;
        }

        .navbar a:hover {
            color: #38bdf8;
        }

        .container {
            padding: 40px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            margin-bottom: 20px;
        }

        button {
            padding: 8px 14px;
            cursor: pointer;
        }

        input {
            padding: 8px;
        }
    </style>
</head>
<body>

<div class="navbar">
    <div>
        <a href="/">Dashboard</a>
        <a href="/history">History</a>
        <a href="/about">About</a>
    </div>
    <div>
        Stock Market Monitor 📈
    </div>
</div>

<div class="container">
    {% block content %}
    {% endblock %}
</div>

</body>
</html>

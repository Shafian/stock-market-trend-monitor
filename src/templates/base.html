<!DOCTYPE html>
<html>
<head>
    <title>Stock Market Trend Monitor</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
        }

        /* NAVBAR */
        .navbar {
            background-color: #1f2937;
            padding: 15px 30px;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            margin-right: 20px;
            font-weight: bold;
        }

        .navbar a:hover {
            color: #38bdf8;
        }

        /* MAIN CONTAINER */
        .container {
            padding: 40px;
        }

        /* CARDS */
        .card {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            margin-bottom: 20px;
        }

        /* FORM */
        .analyzer-form {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        input[type="text"] {
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #ccc;
            width: 250px;
        }

        button {
            padding: 10px 15px;
            border-radius: 6px;
            border: none;
            background-color: #1e293b;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background-color: #334155;
        }

        /* DASHBOARD GRID */
        .card-grid {
            display: flex;
            gap: 20px;
            margin-top: 20px;
        }

        .stat-card {
            flex: 1;
            text-align: center;
        }

        .stat-value {
            font-size: 24px;
            font-weight: bold;
            margin-top: 10px;
        }
    </style>
</head>

<body>

<div class="navbar">
    <div>
        <a href="/about">About</a>
        <a href="/">Dashboard</a>
        <a href="/portfolio">Portfolio</a>
        <a href="/history">History</a>

    
        {% if last_symbol %}
            <a href="/analysis/{{ last_symbol }}">Analysis</a>
        {% else %}
            <a href="/analysis/SPY">Analysis</a>
        {% endif %}
    </div>
    <div>
        Stock Market Monitor 📈
    </div>
</div>

<div class="container">
    {% block content %}
    {% endblock %}
</div>

</body>
</html>

{% extends "base.html" %}

{% block content %}

<div class="card">
    <h2>📊 Stock Analysis Result</h2>

    <p><strong>Stock Symbol:</strong> {{ symbol }}</p>

    <p>
        <strong>Trend:</strong>
        {% if trend == "UP" %}
            <span style="color: green;">📈 {{ trend }}</span>
        {% elif trend == "DOWN" %}
            <span style="color: red;">📉 {{ trend }}</span>
        {% else %}
            {{ trend }}
        {% endif %}
    </p>

    <br>

    <a href="/">
        <button>⬅ Back to Dashboard</button>
    </a>
</div>

{% endblock %}

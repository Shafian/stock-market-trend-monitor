{% extends "base.html" %}

{% block content %}

<div class="card">
    <h2>Stock Analyzer</h2>

    <form action="/analyze" method="POST">
        <input type="text" name="symbol" placeholder="Enter stock symbol (e.g. AAPL)" required>
        <button type="submit">Analyze</button>
    </form>
</div>

<div class="card">
    <h3>Dashboard Overview</h3>
    <p>Use this tool to fetch live stock prices and store them in the database.</p>
</div>

{% endblock %}
